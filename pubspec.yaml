name: englizia
description: "Englizia — English learning app for Arabic speakers (student app)."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.1
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/translations/

  # Fonts are not bundled yet — see assets/fonts/README.md. Until then Flutter
  # falls back to the platform font. Uncomment once the files are in place.
  # fonts:
  #   - family: ReadexPro
  #     fonts:
  #       - asset: assets/fonts/ReadexPro-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/ReadexPro-SemiBold.ttf
  #         weight: 600
  #   - family: Andika
  #     fonts:
  #       - asset: assets/fonts/Andika-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Andika-Bold.ttf
  #         weight: 700
