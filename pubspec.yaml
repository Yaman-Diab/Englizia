name: englizia
description: "Engleazia — English learning app for Arabic speakers (student app)."
publish_to: 'none'

version: 0.0.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.1
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    # Mock mode data (env/mock.json); each file goes when its endpoint is
    # confirmed, see docs/STATUS.md.
    - assets/mock/tracks/
    # Read by google_fonts instead of fetching at runtime; licenses are
    # registered in main.dart.
    - assets/fonts/ReadexPro-Regular.ttf
    - assets/fonts/ReadexPro-SemiBold.ttf
    - assets/fonts/Andika-Regular.ttf
    - assets/fonts/Andika-Bold.ttf
    - assets/fonts/OFL-ReadexPro.txt
    - assets/fonts/OFL-Andika.txt
